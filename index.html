<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>Recrutare – conectare</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; color: #222; }
  </style>
</head>
<body>
  <p id="mesaj">Se finalizează conectarea…</p>
  <noscript><p>Activează JavaScript în browser pentru a continua.</p></noscript>

  <script>
    (function () {
      // SINGURA destinație permisă: aplicația RECRUTARE_MOTOR.
      var DESTINATIE = 'https://script.google.com/macros/s/AKfycbz7075rFkHdikYkDgTKsUUa0H7BTdEmIUCp_6SqJOU4tlgo0P1C0AQDnxhFjXKtaFBmiQ/exec';

      var primite = new URLSearchParams(window.location.search);
      var trimise = new URLSearchParams();

      // Se transmit mai departe DOAR acești trei parametri.
      ['code', 'state', 'error'].forEach(function (cheie) {
        var valoare = primite.get(cheie);
        if (valoare && valoare.length < 2048) {
          trimise.set(cheie, valoare);
        }
      });

      var areDate = trimise.has('error') || (trimise.has('code') && trimise.has('state'));
      if (!areDate || DESTINATIE.indexOf('https://script.google.com/macros/s/') !== 0) {
        document.getElementById('mesaj').textContent =
          'Pagina nu a primit date de conectare. Deschide aplicația și conectează-te din nou.';
        return;
      }

      // replace() șterge această pagină (cu codul în adresă) din istoricul browserului.
      window.location.replace(DESTINATIE + '?' + trimise.toString());
    })();
  </script>
</body>
</html>
